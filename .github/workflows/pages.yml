# GitHub Pages に dist/ を配信する。main への push で自動更新。
# 有効化：リポジトリの Settings → Pages → Build and deployment → Source を「GitHub Actions」にする。
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify data and code
        run: |
          python3 scripts/verify-data.py
          node scripts/verify-core.cjs
          node scripts/verify-lofts.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
